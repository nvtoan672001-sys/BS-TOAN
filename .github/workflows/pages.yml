# Build app, chạy smoke test, rồi đưa lên GitHub Pages (chỉ khi test đạt).
# Bản web chỉ là giao diện: dữ liệu bệnh nhân vẫn lưu trên máy người dùng (thư mục du-lieu / bộ nhớ trình duyệt).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app
        run: |
          mkdir -p dist
          python build.py dist/index.html
      - name: Smoke test
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python kiem-thu/smoke_test.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
